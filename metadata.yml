Identifier: eos70bl
Slug: capmolpred
Status: In progress
Title: CapMolPred
Description: Predicts antimicrobial activity from a molecules SMILES against 
  Escherichia coli, Acinetobacter baumannii, and Staphylococcus aureus. 
  Embeddings from five pretrained chemical language models (ChemBERTa-2, 
  Smole-BERT, MolFormer, MoleBERT, MolCLR) are fused via cross-attention and 
  classified with a capsule network trained with an asymmetric loss to handle 
  severe class imbalance in growth-inhibition data. Validated via case studies 
  on newly reported antibiotics and molecular docking, though training data 
  remain scarce for some pathogens.
