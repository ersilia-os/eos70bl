Identifier: eos70bl
Slug: capmolpred
Status: In progress
Title: CapMolPred
Description: Predicts antimicrobial activity from a molecule's SMILES against
  Escherichia coli, Acinetobacter baumannii, and Staphylococcus aureus
  growth-inhibition assays. Embeddings from five pretrained chemical language
  models (ChemBERTa-2, Smole-BERT, MolFormer, MoleBERT, MolCLR) are fused via
  cross-attention and classified with a capsule network trained with an
  asymmetric loss on severely imbalanced data. Ersilia provides a replicated
  version, retraining the three classifiers from the authors' released data
  and code and fixing an unseeded fusion layer for reproducible inference.
